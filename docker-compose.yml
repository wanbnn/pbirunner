services:
  pbirunner:
    build:
      context: .
      dockerfile: Dockerfile
    image: pbirunner:local
    container_name: pbirunner
    init: true
    restart: unless-stopped
    ports:
      - "${PBI_RUNNER_PORT:-8765}:8765"
    environment:
      PBI_RUNNER_DATA: /data
      PYTHONUNBUFFERED: "1"
    volumes:
      - pbirunner_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/bootstrap', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  pbirunner_data:
    name: pbirunner_data
