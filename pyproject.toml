[project]
name = "pbi-runner"
version = "0.2.0"
description = "Plataforma multiusuário para visualizar arquivos PBIX e projetos PBIP"
requires-python = ">=3.10,<3.14"
dependencies = ["pbixray==0.15.3"]

[project.scripts]
pbi-runner = "pbi_viewer.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
pbi_viewer = ["static/*", "static/vendor/*"]

[tool.setuptools]
packages = ["pbi_viewer"]
